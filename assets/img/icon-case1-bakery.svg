<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="100" cy="100" r="92" fill="#FBF8F2" stroke="#D9CFBC" stroke-width="2"/>

  <!-- candle flame -->
  <path d="M100,56 C105,61 105,68 100,72 C95,68 95,61 100,56 Z" fill="#B5663D"/>
  <!-- candle -->
  <line x1="100" y1="72" x2="100" y2="92" stroke="#B5663D" stroke-width="5" stroke-linecap="round"/>

  <!-- top tier -->
  <rect x="80" y="92" width="40" height="28" rx="5" fill="none" stroke="#B5663D" stroke-width="5" stroke-linejoin="round"/>
  <!-- bottom tier -->
  <rect x="64" y="120" width="72" height="36" rx="5" fill="none" stroke="#B5663D" stroke-width="5" stroke-linejoin="round"/>

  <!-- plate -->
  <ellipse cx="100" cy="160" rx="50" ry="7" fill="none" stroke="#B5663D" stroke-width="5" stroke-linecap="round"/>

  <!-- decorative dots -->
  <circle cx="92" cy="106" r="2.6" fill="#B5663D"/>
  <circle cx="108" cy="106" r="2.6" fill="#B5663D"/>
  <circle cx="78" cy="138" r="2.6" fill="#B5663D"/>
  <circle cx="100" cy="138" r="2.6" fill="#B5663D"/>
  <circle cx="122" cy="138" r="2.6" fill="#B5663D"/>
</svg>
