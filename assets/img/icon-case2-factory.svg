<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="100" cy="100" r="92" fill="#FBF8F2" stroke="#D9CFBC" stroke-width="2"/>

  <!-- smoke -->
  <path d="M72,66 C68,62 76,58 72,54" fill="none" stroke="#B5663D" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M114,58 C110,54 118,50 114,46" fill="none" stroke="#B5663D" stroke-width="3.5" stroke-linecap="round"/>

  <!-- chimneys -->
  <rect x="66" y="70" width="12" height="28" fill="none" stroke="#B5663D" stroke-width="5" stroke-linejoin="round"/>
  <rect x="108" y="60" width="12" height="38" fill="none" stroke="#B5663D" stroke-width="5" stroke-linejoin="round"/>

  <!-- sawtooth roof -->
  <polyline points="58,98 79,76 100,98 121,76 142,98" fill="none" stroke="#B5663D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- building body -->
  <rect x="58" y="98" width="84" height="46" fill="none" stroke="#B5663D" stroke-width="5" stroke-linejoin="round"/>

  <!-- windows -->
  <rect x="70" y="112" width="14" height="14" fill="none" stroke="#B5663D" stroke-width="3.5"/>
  <rect x="93" y="112" width="14" height="14" fill="none" stroke="#B5663D" stroke-width="3.5"/>

  <!-- ground line -->
  <line x1="50" y1="150" x2="150" y2="150" stroke="#B5663D" stroke-width="5" stroke-linecap="round"/>

  <!-- gear accent, bottom right -->
  <g stroke="#B5663D" stroke-width="0" fill="#B5663D">
    <rect x="142" y="126" width="8" height="10" transform="rotate(0 146 150)"/>
    <rect x="142" y="126" width="8" height="10" transform="rotate(45 146 150)"/>
    <rect x="142" y="126" width="8" height="10" transform="rotate(90 146 150)"/>
    <rect x="142" y="126" width="8" height="10" transform="rotate(135 146 150)"/>
    <rect x="142" y="126" width="8" height="10" transform="rotate(180 146 150)"/>
    <rect x="142" y="126" width="8" height="10" transform="rotate(225 146 150)"/>
    <rect x="142" y="126" width="8" height="10" transform="rotate(270 146 150)"/>
    <rect x="142" y="126" width="8" height="10" transform="rotate(315 146 150)"/>
  </g>
  <circle cx="146" cy="150" r="16" fill="#FBF8F2" stroke="#B5663D" stroke-width="4.5"/>
  <circle cx="146" cy="150" r="5.5" fill="none" stroke="#B5663D" stroke-width="4"/>
</svg>
